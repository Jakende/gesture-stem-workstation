[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gesture-stem-processor"
version = "0.1.0"
description = "Local processing API for Gesture Stem Workstation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.17,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]
separation = ["audio-separator>=0.35,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/gesture_stem_processor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

